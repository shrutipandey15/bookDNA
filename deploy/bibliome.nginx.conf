# Bibliome — nginx reverse proxy configuration
# Backend: uvicorn on 127.0.0.1:${API_PORT}
# Frontend: static Vite build in ${FE_DIR}
#
# This file is a TEMPLATE. deploy.sh renders it with envsubst, substituting only
# ${DOMAIN}, ${FE_DIR} and ${API_PORT} — every other $name below is an nginx
# runtime variable and must survive rendering literally:
#
#   envsubst '${DOMAIN} ${FE_DIR} ${API_PORT}' \
#     < deploy/bibliome.nginx.conf > /etc/nginx/sites-available/bibliome
#   sudo ln -s /etc/nginx/sites-available/bibliome /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Do NOT run certbot. TLS terminates at Cloudflare and the tunnel connects to
# http://localhost:80 — there is no public :443 to validate against, and .app is
# HSTS-preloaded so the browser side is covered by Cloudflare's edge cert.
#
# NOTE: the limit_req_zone below must live in the http{} context. If nginx errors
# with "limit_req_zone directive is not allowed here", move that one line into
# /etc/nginx/nginx.conf (http block) and keep the limit_req in the location.

limit_req_zone $binary_remote_addr zone=bibliome_api:10m rate=20r/s;

server {
    server_name ${DOMAIN};

    # ── Real client IP (Cloudflare edge → cloudflared → nginx) ──
    # cloudflared runs on loopback; trust it, and take the real client from
    # Cloudflare's own header rather than a spoofable XFF chain. Without this
    # nginx sees 127.0.0.1 for every request and the app rate-limits the whole
    # internet as a single client.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # ── Security headers (audit P1-8) ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 'unsafe-inline' in script-src is load-bearing: index.html carries the theme
    # IIFE (runs before first paint, prevents the Vellum/Lamplight flash) and a
    # JSON-LD block. Both are blocked by a bare 'self'.
    # TODO: move to a nonce-based CSP — needs the nonce injected into index.html
    # at request time (sub_filter or an SSR step), which we don't have yet.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Cap request bodies (CSV import is the largest legitimate payload).
    client_max_body_size 6m;

    # ── Frontend: static SPA ──
    location / {
        root ${FE_DIR};
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively (Vite hashes filenames)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";

            # add_header does NOT merge across levels: declaring any add_header
            # here discards every add_header inherited from server{}. Without the
            # repeat below, all five security headers silently vanished from every
            # JS, CSS and image response — including nosniff on our JavaScript.
            # If you add a header to the server block, add it here too.
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }

        # NOTE: sw.js and manifest.webmanifest deliberately have NO rule here.
        # Browsers fetch a service-worker script bypassing the HTTP cache
        # (`updateViaCache` defaults to "imports"), so the immutable rule above
        # does not actually pin it; and a stale manifest only matters if the app
        # name or icons change. Not worth a config change on its own.
        #
        # index.html must NEVER be cached, and this is not a nicety.
        #
        # Vite names every chunk by content hash, and a deploy replaces the whole
        # assets/ directory — the old chunks are deleted. A browser holding a
        # cached index.html therefore asks for chunk names that no longer exist
        # on disk. The shell boots (it is cached too), then the first lazy route
        # 404s and the page goes blank with
        #     "Failed to fetch dynamically imported module".
        # That is exactly what /settings did after the last deploy.
        #
        # The hashed assets above stay immutable — that is safe precisely BECAUSE
        # their names change. Only the one unhashed file needs revalidating.
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate" always;
            expires -1;

            # add_header does not merge across levels — repeat the security set,
            # same as in the assets block above.
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }

        # Same reasoning as index.html: this is an unhashed file the frontend
        # build rewrites every deploy (one id per build), and a long-lived PWA
        # window polls it to notice it has gone stale and reload itself
        # (src/hooks/useAppUpdate.js in the frontend repo). It must always be
        # revalidated or that check can be answered from a stale cache. Tiny
        # (~40 bytes) and only hit on a 10-minute poll, so "never cache" costs
        # nothing. The client also sends it `cache: no-store`; this is the
        # origin-side half of the same guarantee.
        location = /version.json {
            add_header Cache-Control "no-cache, must-revalidate" always;
            expires -1;

            # add_header does not merge across levels — repeat the security set,
            # same as in the blocks above.
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }
    }

    # ── Backend API ──
    location /api/ {
        # nginx-level rate limit (defense in depth; app also rate-limits).
        limit_req zone=bibliome_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:${API_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Deliberately NOT $proxy_add_x_forwarded_for: real_ip_module has already
        # resolved $remote_addr to the true client, so emitting a single value
        # makes the chain deterministic and TRUSTED_PROXY_COUNT=1 exactly right.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # DNA generation can take a few seconds
        proxy_read_timeout 30s;
    }

    # ── Health check ──
    location /health {
        proxy_pass http://127.0.0.1:${API_PORT};
    }

    # ── Gzip ──
    # NOTE: gzip on TLS + secrets in responses is BREACH-adjacent. JSON API
    # responses here carry no cross-request secrets (tokens are in httpOnly
    # cookies / short-lived access tokens), so this is acceptable.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1000;

    # Plain :80 only — the Cloudflare tunnel connects here. See the certbot note
    # at the top of this file.
    listen 80;
}
